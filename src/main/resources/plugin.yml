name: TwilightClaims
main: com.twilight.claims.TwilightClaims
version: '${project.version}'
api-version: '26.3'
author: Haizenfell
description: WorldGuard-based claim system.

depend: [WorldGuard, WorldEdit]
softdepend: [PlaceholderAPI]

commands:
  claim:
    description: Create and manage WorldGuard-backed claims.
  trust:
    description: Add a player to the current claim members.
  untrust:
    description: Remove a player from the current claim members.
  trustlist:
    description: Show trusted players for a claim.
  claimsmanaged:
    description: Inspect and reconcile externally managed claims.
    permission: twilight.claim.managed.admin

permissions:
  twilight.claim.managed.admin:
    default: op
  twilight.claim.command.claim:
    default: op
  twilight.claim.command.claimpoints:
    default: op
  twilight.claim.command.unclaim:
    default: op
  twilight.claim.command.claimtool:
    default: op
  twilight.claim.command.trust:
    default: op
  twilight.claim.command.untrust:
    default: op
  twilight.claim.command.trustlist:
    default: op
  twilight.claim.points.*:
    default: false
