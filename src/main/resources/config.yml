claim:
  min-radius: 5

points:
  per-hour-default: 50
  groups:
    twilight.claim.points.nova: 60
    twilight.claim.points.astralis: 70
    twilight.claim.points.dev: 100

tools:
  shovel:
    material: GOLDEN_SHOVEL
    name: "&9Claim Shovel"
    lore:
      - "&7"
      - "&7Type §9/claim §7To create a new claim"
      - "&7"
      - "&9Right-Click §7a corner or side if you want to resize your claim"
      - "&7"
      - "&7Type §9/trust <player>§7 to add a player to"
      - "&7the list of trusted persons for this claim"
      - "&7"
      - "&7and §9/untrust <player>§7 to remove"
      - "&7a player from the trusted list"
      - "&7"
      - "&7The §9Sea Lantern §7and §9Prismarine§7 blocks mark"
      - "&7the corners and sides of your claim"

  stick:
    material: STICK
    name: "&9Claim Inspector"
    lore:
      - "&7"
      - "&9Left-Click &7on a block to see if anyone has claimed it"
      - "&7"
      - "&9Right-click&7 to locate the nearest region within 100 blocks"
      - "&7"

stick-tool:
  enabled: true
  scan-radius: 100
  visualize-radius: 50
  visualize-duration: 5

  messages:
    unclaimed: "&9This block is not claimed."
    inspect:
      header: "&6Region Info:"
      entry: "&7ID: &f%id% &7Owner: &f%owner% &7Area: &f%area%"
    no-nearby: "&9No claimed regions nearby."
    nearest-format: "&eNearest region: &f%owner% &7(%distance%m) %arrow%"

  arrows:
    front: "&f↑"
    back: "&f↓"
    left: "&f←"
    right: "&f→"

visual:
  edge-step-small: 3
  edge-step-big: 5
  edge-big-threshold: 10
  visual-duration-ticks: 200
  error-duration: 10
  corner-block: "SEA_LANTERN"
  extend-block: "PRISMARINE"

  corner-block_error: "SHROOMLIGHT"
  extend-block_error: "CRIMSON_NYLIUM"
  pos1-block: "DIAMOND_BLOCK"

